name: CI

# `pull_request`, never `pull_request_target`: pull requests from forks run
# without secrets or a write token. This workflow needs neither.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:17 UTC: every browser and the full accessibility sweep.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The built site, served by `wrangler dev`, also runs the `_headers` tests.
  MARKDOWN_BASE_URL: http://localhost:4321
  ASTRO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Lint, build and test (Chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history, so the accessibility tests can diff against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Prettier
        run: pnpm exec prettier --check . --ignore-path .prettierignore

      - run: pnpm build

      - run: pnpm check

      - run: pnpm exec playwright install --with-deps chromium

      # Changed examples only. The weekly run checks everything.
      - run: pnpm exec playwright test --project=chromium

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  full:
    name: Every browser and the full accessibility sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps

      - name: Accessibility, every example and site page (Chromium)
        run: pnpm exec playwright test accessibility --project=chromium
        env:
          A11Y_ALL: 1

      - name: Everything else (Firefox and WebKit)
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --project=firefox --project=webkit --grep-invert "WCAG 2.1 AA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14
