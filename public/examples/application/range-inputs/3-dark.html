<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base with min and max labels (dark) - Range Inputs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6 dark:bg-gray-900">
    <label for="maxVolume">
      <span class="block text-sm font-medium text-gray-900 dark:text-white">Max Volume</span>

      <input
        type="range"
        name="maxVolume"
        id="maxVolume"
        min="0"
        max="100"
        value="20"
        class="mt-3 h-3.5 w-full appearance-none rounded-full bg-gray-300 dark:bg-gray-600 [&::-webkit-slider-thumb]:size-7 [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-[6px] [&::-webkit-slider-thumb]:border-gray-500 [&::-webkit-slider-thumb]:bg-gray-200 dark:[&::-webkit-slider-thumb]:border-gray-400 dark:[&::-webkit-slider-thumb]:bg-gray-700"
      />

      <div class="mt-1 flex items-center justify-between">
        <span class="text-xs font-medium text-gray-700 dark:text-gray-200">0%</span>
        <span class="text-xs font-medium text-gray-700 dark:text-gray-200">100%</span>
      </div>
    </label>
  </body>
</html>
