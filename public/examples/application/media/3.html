<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stretch card - Media - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <article class="flex items-stretch gap-4 overflow-hidden rounded-xl ring-1 ring-gray-200">
      <img
        alt=""
        src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=1160"
        class="w-28 shrink-0 object-cover sm:w-36"
      />
      <div class="flex min-w-0 flex-col justify-between p-4 ps-0">
        <div>
          <h3 class="font-medium text-gray-900">Design review, Thursday</h3>
          <p class="mt-1 text-sm text-pretty text-gray-600">
            Walk through the new checkout flow with the product team and agree what ships in March.
          </p>
        </div>
        <p class="mt-3 text-sm font-medium text-gray-900">3:00 pm, Room 4</p>
      </div>
    </article>
  </body>
</html>
