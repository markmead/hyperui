<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacked on mobile - Media - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <article class="flex flex-col gap-4 sm:flex-row sm:items-start">
      <img
        alt=""
        src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=1160"
        class="aspect-video w-full rounded-lg object-cover sm:aspect-square sm:size-32 sm:w-32 sm:shrink-0"
      />
      <div class="min-w-0">
        <h3 class="font-medium text-gray-900 sm:text-lg">Spring workshop: planning with data</h3>
        <p class="mt-1 text-pretty text-gray-600">
          A half day session on turning last quarter's numbers into next quarter's plan. Lunch is
          included.
        </p>
        <a
          href="#"
          class="mt-3 inline-block text-sm font-medium text-indigo-600 underline underline-offset-4 hover:text-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >Reserve a seat</a
        >
      </div>
    </article>
  </body>
</html>
