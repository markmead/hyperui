<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>With status (dark) - Avatars - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex flex-wrap items-center justify-center gap-6 p-6 dark:bg-gray-900">
    <span class="relative inline-block">
      <img
        alt="Priya Natarajan"
        src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=160&h=160"
        class="size-12 rounded-full object-cover"
      />

      <span
        class="absolute end-0 bottom-0 block size-3.5 rounded-full bg-green-600 ring-2 ring-white dark:bg-green-500 dark:ring-gray-900"
      >
        <span class="sr-only">Online</span>
      </span>
    </span>

    <span class="relative inline-block">
      <img
        alt="Marcus Boyle"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=160&h=160"
        class="size-12 rounded-full object-cover"
      />

      <span
        class="absolute end-0 bottom-0 flex size-3.5 items-center justify-center rounded-full bg-amber-600 ring-2 ring-white dark:bg-amber-400 dark:ring-gray-900"
      >
        <span aria-hidden="true" class="size-1.5 rounded-full bg-white dark:bg-gray-900"></span>
        <span class="sr-only">Away</span>
      </span>
    </span>

    <span class="relative inline-block">
      <img
        alt="Freya Lindqvist"
        src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&q=80&w=160&h=160"
        class="size-12 rounded-full object-cover"
      />

      <span
        class="absolute end-0 bottom-0 flex size-3.5 items-center justify-center rounded-full bg-red-600 ring-2 ring-white dark:bg-red-500 dark:ring-gray-900"
      >
        <span aria-hidden="true" class="h-0.5 w-2 rounded-full bg-white dark:bg-gray-900"></span>
        <span class="sr-only">Busy</span>
      </span>
    </span>

    <span class="relative inline-block">
      <img
        alt="Owen Baptiste"
        src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=160&h=160"
        class="size-12 rounded-full object-cover"
      />

      <span
        class="absolute end-0 bottom-0 block size-3.5 rounded-full border-2 border-gray-500 bg-white ring-2 ring-white dark:border-gray-400 dark:bg-gray-900 dark:ring-gray-900"
      >
        <span class="sr-only">Offline</span>
      </span>
    </span>
  </body>
</html>
