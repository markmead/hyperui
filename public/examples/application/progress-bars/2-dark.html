<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>With labels and status colors (dark) - Progress Bars - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md space-y-6 p-6 dark:bg-gray-900">
    <div
      role="progressbar"
      aria-valuenow="25"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-labelledby="UpdatingLabel"
    >
      <div class="flex justify-between gap-4">
        <span id="UpdatingLabel" class="text-sm font-medium text-gray-900 dark:text-white"
          >Updating</span
        >

        <span class="text-sm font-medium text-gray-900 dark:text-white">25%</span>
      </div>

      <div class="mt-2 h-2 w-full rounded-full bg-gray-200 dark:bg-gray-700">
        <div class="h-full rounded-full bg-blue-600 dark:bg-blue-300" style="width: 25%"></div>
      </div>
    </div>

    <div
      role="progressbar"
      aria-valuenow="100"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-labelledby="DownloadingLabel"
    >
      <div class="flex justify-between gap-4">
        <span id="DownloadingLabel" class="text-sm font-medium text-gray-900 dark:text-white"
          >Downloading</span
        >

        <span class="text-sm font-medium text-gray-900 dark:text-white">100%</span>
      </div>

      <div class="mt-2 h-2 w-full rounded-full bg-gray-200 dark:bg-gray-700">
        <div class="h-full rounded-full bg-green-600 dark:bg-green-300" style="width: 100%"></div>
      </div>
    </div>

    <div
      role="progressbar"
      aria-valuenow="50"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-labelledby="LoadingLabel"
    >
      <div class="flex justify-between gap-4">
        <span id="LoadingLabel" class="text-sm font-medium text-gray-900 dark:text-white"
          >Loading</span
        >

        <span class="text-sm font-medium text-gray-900 dark:text-white">50%</span>
      </div>

      <div class="mt-2 h-2 w-full rounded-full bg-gray-200 dark:bg-gray-700">
        <div class="h-full rounded-full bg-gray-600 dark:bg-gray-300" style="width: 50%"></div>
      </div>
    </div>
  </body>
</html>
