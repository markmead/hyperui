<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No results with filters - Empty States - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-screen items-center justify-center p-6">
    <div class="max-w-md text-center">
      <span
        class="mx-auto flex size-12 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 ring-1 ring-indigo-600/10"
        ><svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Zm3.75 11.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
          /></svg
      ></span>
      <h2 class="mt-5 text-lg font-semibold text-gray-900">No invoices match these filters</h2>
      <p class="mt-2 text-pretty text-gray-600">
        Remove a filter to widen the list, or clear them all.
      </p>
      <ul class="mt-4 flex flex-wrap justify-center gap-2" aria-label="Active filters">
        <li
          class="inline-flex items-center gap-1 rounded-full bg-gray-100 py-1 ps-3 pe-1.5 text-sm text-gray-900"
        >
          Status: overdue<button
            type="button"
            class="rounded-full p-0.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-indigo-600"
          >
            <span class="sr-only">Remove filter Status: overdue</span
            ><svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>
        <li
          class="inline-flex items-center gap-1 rounded-full bg-gray-100 py-1 ps-3 pe-1.5 text-sm text-gray-900"
        >
          Amount over $5,000<button
            type="button"
            class="rounded-full p-0.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-indigo-600"
          >
            <span class="sr-only">Remove filter Amount over $5,000</span
            ><svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>
        <li
          class="inline-flex items-center gap-1 rounded-full bg-gray-100 py-1 ps-3 pe-1.5 text-sm text-gray-900"
        >
          Client: Acme<button
            type="button"
            class="rounded-full p-0.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-indigo-600"
          >
            <span class="sr-only">Remove filter Client: Acme</span
            ><svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>
      </ul>
      <button
        type="button"
        class="mt-6 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        Clear all filters
      </button>
    </div>
  </body>
</html>
