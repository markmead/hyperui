<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming soon (dark) - Empty States - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-screen items-center justify-center p-6 dark:bg-gray-900">
    <div class="w-full max-w-md text-center">
      <p class="text-sm font-medium text-indigo-600 dark:text-indigo-300">Launching in March</p>
      <h2 class="mt-2 text-2xl font-semibold text-gray-900 dark:text-white">
        Reports are almost here
      </h2>
      <p class="mt-3 text-pretty text-gray-600 dark:text-gray-300">
        Add your email and we'll send one message when reports are ready. Nothing else.
      </p>
      <form class="mt-6 flex flex-col gap-3 sm:flex-row">
        <label for="email" class="sr-only">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@company.com"
          class="min-w-0 flex-1 rounded-lg border-gray-300 px-3.5 py-2.5 text-sm focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden dark:border-gray-600 dark:bg-gray-900 dark:text-white dark:focus:border-indigo-300 dark:focus:ring-indigo-300"
        />
        <button
          type="submit"
          class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-300 dark:text-gray-900 dark:hover:bg-indigo-200 dark:focus-visible:outline-indigo-300"
        >
          Email me at launch
        </button>
      </form>
    </div>
  </body>
</html>
