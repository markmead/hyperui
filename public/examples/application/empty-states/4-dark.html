<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get started (dark) - Empty States - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-screen items-center justify-center p-6 dark:bg-gray-900">
    <div class="w-full max-w-md">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
        Finish setting up your workspace
      </h2>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">1 of 3 steps done</p>
      <div
        class="mt-3 h-1.5 overflow-hidden rounded-full bg-gray-100 dark:bg-gray-800"
        role="progressbar"
        aria-label="Setup progress"
        aria-valuemin="0"
        aria-valuemax="3"
        aria-valuenow="1"
      >
        <div class="h-full w-1/3 rounded-full bg-indigo-600 dark:bg-indigo-300"></div>
      </div>
      <ol class="mt-6 space-y-5">
        <li class="flex gap-3">
          <span
            class="mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-white dark:bg-indigo-300 dark:text-gray-900"
            ><svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg
          ></span>
          <span
            ><span class="block text-sm font-medium text-gray-900 dark:text-white"
              >Create your workspace</span
            ><span class="block text-sm text-gray-600 dark:text-gray-300"
              >Done. Northwind is ready.</span
            ></span
          >
        </li>
        <li class="flex gap-3">
          <span
            class="mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-full ring-1 ring-gray-300 ring-inset dark:ring-gray-600"
          ></span>
          <span
            ><span class="block text-sm font-medium text-gray-900 dark:text-white"
              >Invite your team</span
            ><span class="block text-sm text-gray-600 dark:text-gray-300"
              >Teammates can see projects as soon as they join.</span
            ></span
          >
        </li>
        <li class="flex gap-3">
          <span
            class="mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-full ring-1 ring-gray-300 ring-inset dark:ring-gray-600"
          ></span>
          <span
            ><span class="block text-sm font-medium text-gray-900 dark:text-white"
              >Create your first project</span
            ><span class="block text-sm text-gray-600 dark:text-gray-300"
              >Start from a template or a blank page.</span
            ></span
          >
        </li>
      </ol>
      <button
        type="button"
        class="mt-8 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-300 dark:text-gray-900 dark:hover:bg-indigo-200 dark:focus-visible:outline-indigo-300"
      >
        Invite teammates
      </button>
    </div>
  </body>
</html>
