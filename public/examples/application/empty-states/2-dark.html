<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Import or create (dark) - Empty States - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-screen items-center justify-center p-6 dark:bg-gray-900">
    <div class="w-full max-w-xl text-center">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Add your first customers</h2>
      <p class="mt-2 text-pretty text-gray-600 dark:text-gray-300">
        Bring in the list you already have, or start from a blank record.
      </p>
      <div class="mt-6 grid gap-4 sm:grid-cols-2">
        <button
          type="button"
          class="group rounded-xl p-5 text-start ring-1 ring-gray-200 hover:ring-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:ring-gray-700 dark:hover:ring-indigo-300 dark:focus-visible:outline-indigo-300"
        >
          <span class="block font-medium text-gray-900 dark:text-white">Import a CSV</span>
          <span class="mt-1 block text-sm text-gray-600 dark:text-gray-300"
            >Map columns to fields. Up to 10,000 rows.</span
          >
        </button>
        <button
          type="button"
          class="group rounded-xl p-5 text-start ring-1 ring-gray-200 hover:ring-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:ring-gray-700 dark:hover:ring-indigo-300 dark:focus-visible:outline-indigo-300"
        >
          <span class="block font-medium text-gray-900 dark:text-white">Add a customer</span>
          <span class="mt-1 block text-sm text-gray-600 dark:text-gray-300"
            >Enter one customer by hand.</span
          >
        </button>
      </div>
    </div>
  </body>
</html>
