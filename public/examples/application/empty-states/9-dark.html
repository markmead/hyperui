<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Out of stock (dark) - Empty States - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-screen items-center justify-center p-6 dark:bg-gray-900">
    <div class="w-full max-w-md">
      <div class="flex gap-4 rounded-xl p-4 ring-1 ring-gray-200 dark:ring-gray-700">
        <div
          class="flex size-20 shrink-0 items-center justify-center rounded-lg bg-gray-100 text-gray-400 dark:bg-gray-800"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
            />
          </svg>
        </div>
        <div>
          <h2 class="font-semibold text-gray-900 dark:text-white">Trail Pack 30L</h2>
          <p
            class="mt-1 inline-block rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-medium text-red-700 dark:bg-red-800 dark:text-red-200"
          >
            Out of stock
          </p>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">Back in about 3 weeks.</p>
        </div>
      </div>
      <form class="mt-4 flex flex-col gap-3 sm:flex-row">
        <label for="restock-email" class="sr-only">Email address</label>
        <input
          id="restock-email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@email.com"
          class="min-w-0 flex-1 rounded-lg border-gray-300 px-3.5 py-2.5 text-sm focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-hidden dark:border-gray-600 dark:bg-gray-900 dark:text-white dark:focus:border-indigo-300 dark:focus:ring-indigo-300"
        />
        <button
          type="submit"
          class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-300 dark:text-gray-900 dark:hover:bg-indigo-200 dark:focus-visible:outline-indigo-300"
        >
          Notify me
        </button>
      </form>
      <p class="mt-4 text-sm text-gray-600 dark:text-gray-300">
        Or
        <a
          href="#"
          class="font-medium text-indigo-600 underline underline-offset-4 hover:text-indigo-700 dark:text-indigo-300 dark:hover:text-indigo-200"
          >browse similar packs</a
        >.
      </p>
    </div>
  </body>
</html>
