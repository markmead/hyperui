<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload data - Empty States - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-screen items-center justify-center p-6">
    <div class="w-full max-w-lg">
      <label
        for="files"
        class="flex cursor-pointer flex-col items-center rounded-xl border-2 border-dashed border-gray-300 p-10 text-center hover:border-indigo-600 has-focus-visible:border-indigo-600 has-focus-visible:ring-2 has-focus-visible:ring-indigo-600/30"
      >
        <span
          class="flex size-12 items-center justify-center rounded-full bg-indigo-50 text-indigo-600"
          ><svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15m0-3-3-3m0 0-3 3m3-3V15"
            /></svg
        ></span>
        <span class="mt-4 text-sm text-gray-600"
          ><span class="font-medium text-indigo-600">Choose files</span> or drag them here</span
        >
        <span class="mt-1 text-xs text-gray-500">PDF, DOCX or XLSX up to 10 MB each</span>
        <input id="files" type="file" multiple class="sr-only" />
      </label>
    </div>
  </body>
</html>
