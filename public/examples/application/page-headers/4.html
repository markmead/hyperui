<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>With tabs - Page headers - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="bg-gray-50">
    <header class="border-b border-gray-200 bg-white px-6 pt-6">
      <div class="flex items-center justify-between gap-4">
        <h1 class="text-2xl font-semibold text-gray-900">Settings</h1>

        <a
          href="#"
          class="inline-block rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
          >Save changes</a
        >
      </div>

      <nav aria-label="Settings" class="mt-4 -mb-px">
        <ul class="flex gap-6 overflow-x-auto text-sm font-medium">
          <li>
            <a
              href="#"
              aria-current="page"
              class="block border-b-2 border-gray-900 pb-3 whitespace-nowrap text-gray-900"
            >
              General
            </a>
          </li>

          <li>
            <a
              href="#"
              class="block border-b-2 border-transparent pb-3 whitespace-nowrap text-gray-600 transition-colors hover:border-gray-300 hover:text-gray-900"
            >
              Team
            </a>
          </li>

          <li>
            <a
              href="#"
              class="block border-b-2 border-transparent pb-3 whitespace-nowrap text-gray-600 transition-colors hover:border-gray-300 hover:text-gray-900"
            >
              Billing
            </a>
          </li>

          <li>
            <a
              href="#"
              class="block border-b-2 border-transparent pb-3 whitespace-nowrap text-gray-600 transition-colors hover:border-gray-300 hover:text-gray-900"
            >
              Notifications
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
