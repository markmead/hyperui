<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top bar with sidebar - App shells - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body data-sidebar="closed" class="group flex h-screen flex-col overflow-hidden bg-gray-50">
    <header
      class="relative z-50 flex items-center justify-between gap-4 border-b border-gray-200 bg-white px-6 py-3"
    >
      <div class="flex items-center gap-4">
        <button
          type="button"
          id="sidebar-toggle"
          aria-expanded="false"
          aria-controls="app-sidebar"
          class="rounded-md p-2 text-gray-600 transition-colors hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 lg:hidden"
        >
          <span class="sr-only">Toggle menu</span>

          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            class="size-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <span
          class="grid h-12 w-32 place-content-center rounded-lg bg-gray-100 text-sm text-gray-600"
          >Logo</span
        >
      </div>

      <a
        href="#"
        class="flex items-center gap-2 rounded-full focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
      >
        <span class="sr-only">Priya Natarajan, account</span>

        <img
          alt=""
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=160&h=160"
          class="size-9 rounded-full object-cover"
        />
      </a>
    </header>

    <div class="relative flex flex-1 overflow-hidden">
      <div
        data-sidebar-overlay
        aria-hidden="true"
        class="absolute inset-0 z-30 hidden bg-gray-900/50 group-data-[sidebar=open]:block lg:hidden"
      ></div>

      <div
        id="app-sidebar"
        class="absolute inset-y-0 start-0 z-40 w-64 -translate-x-full overflow-y-auto border-e border-gray-200 bg-white p-4 transition-[transform,visibility] duration-300 group-data-[sidebar=open]:translate-x-0 max-lg:invisible max-lg:group-data-[sidebar=open]:visible lg:static lg:shrink-0 lg:translate-x-0 max-lg:rtl:translate-x-full max-lg:rtl:group-data-[sidebar=open]:translate-x-0"
      >
        <nav aria-label="Main">
          <ul class="space-y-1">
            <li>
              <a
                href="#"
                aria-current="page"
                class="block rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-900"
                >Overview</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900"
                >Customers</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900"
                >Orders</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900"
                >Billing</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900"
                >Settings</a
              >
            </li>
          </ul>
        </nav>
      </div>

      <div class="flex flex-1 flex-col overflow-y-auto">
        <main class="flex-1 p-6">
          <div class="h-full min-h-48 rounded-lg border-2 border-dashed border-gray-200"></div>
        </main>
      </div>
    </div>

    <script>
      const sidebarToggle = document.getElementById('sidebar-toggle')
      const sidebarPanel = document.getElementById('app-sidebar')
      const sidebarOverlay = document.querySelector('[data-sidebar-overlay]')

      function setSidebarOpen(isOpen) {
        document.body.dataset.sidebar = isOpen ? 'open' : 'closed'
        sidebarToggle.setAttribute('aria-expanded', String(isOpen))

        if (isOpen) {
          // The panel turns visible one frame into the transition, so focus after that
          requestAnimationFrame(() =>
            requestAnimationFrame(() => sidebarPanel.querySelector('a')?.focus()),
          )
        }
      }

      sidebarToggle.addEventListener('click', () => {
        setSidebarOpen(sidebarToggle.getAttribute('aria-expanded') !== 'true')
      })

      sidebarOverlay.addEventListener('click', () => setSidebarOpen(false))

      document.addEventListener('keydown', (keyboardEvent) => {
        if (keyboardEvent.key === 'Escape' && document.body.dataset.sidebar === 'open') {
          setSidebarOpen(false)
          sidebarToggle.focus()
        }
      })
    </script>
  </body>
</html>
