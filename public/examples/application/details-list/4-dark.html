<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striped and bordered (dark) - Details Lists - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6 dark:bg-gray-900">
    <div class="overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700">
      <dl
        class="divide-y divide-gray-200 text-sm dark:divide-gray-700 [&>div:nth-child(odd)]:bg-gray-50 dark:[&>div:nth-child(odd)]:bg-gray-800"
      >
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Region</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">eu-west-2 (London)</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Instance</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">
            <span class="font-mono">c6.large</span>
          </dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">IP address</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">
            <span class="font-mono">203.0.113.24</span>
          </dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Uptime</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">
            99.98% over the last 30 days
          </dd>
        </div>
      </dl>
    </div>
  </body>
</html>
