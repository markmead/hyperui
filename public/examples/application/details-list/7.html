<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compact key and value pairs - Details Lists - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <h2 class="text-sm font-semibold text-gray-900">Account</h2>
    <div class="mt-4">
      <dl class="space-y-3 text-sm">
        <div class="flex items-center justify-between">
          <dt class="text-gray-600">Plan</dt>
          <dd class="font-medium text-gray-900">Team, 5 seats</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-gray-600">Customer since</dt>
          <dd class="font-medium text-gray-900">Feb 2024</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-gray-600">Open tickets</dt>
          <dd class="font-medium text-gray-900">1</dd>
        </div>
      </dl>
    </div>
  </body>
</html>
