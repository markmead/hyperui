<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striped - Details Lists - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6">
    <div class="flow-root">
      <dl class="-my-3 text-sm [&>div:nth-child(odd)]:bg-gray-50">
        <div class="grid grid-cols-1 gap-1 px-3 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900">Full name</dt>
          <dd class="text-gray-700 sm:col-span-2">Amara Okafor</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-3 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900">Role</dt>
          <dd class="text-gray-700 sm:col-span-2">Product designer</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-3 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900">Email</dt>
          <dd class="text-gray-700 sm:col-span-2">amara@northwind.co</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-3 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900">Location</dt>
          <dd class="text-gray-700 sm:col-span-2">Bristol, United Kingdom</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-3 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900">About</dt>
          <dd class="text-gray-700 sm:col-span-2">
            Leads the checkout and onboarding work. Previously designed mobile banking at Monzo.
          </dd>
        </div>
      </dl>
    </div>
  </body>
</html>
