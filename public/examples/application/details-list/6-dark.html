<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two columns (dark) - Details Lists - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6 dark:bg-gray-900">
    <dl class="grid grid-cols-1 gap-x-10 text-sm sm:grid-cols-2">
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Bedrooms</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">3</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Bathrooms</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">2</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Floor area</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">112 m²</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Year built</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">1998</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Parking</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">Garage, 1 car</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Heating</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">Gas central</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Council tax</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">Band D</dd>
      </div>
      <div class="flex justify-between gap-4 border-b border-gray-200 py-2 dark:border-gray-700">
        <dt class="text-gray-600 dark:text-gray-300">Tenure</dt>
        <dd class="text-end font-medium text-gray-900 dark:text-white">Freehold</dd>
      </div>
    </dl>
  </body>
</html>
