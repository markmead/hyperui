<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bordered with action (dark) - Details Lists - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6 dark:bg-gray-900">
    <div class="rounded-xl border border-gray-200 dark:border-gray-700">
      <div
        class="flex items-center justify-between gap-4 border-b border-gray-200 px-4 py-3 dark:border-gray-700"
      >
        <h2 class="font-semibold text-gray-900 dark:text-white">Billing details</h2>
        <a
          href="#"
          class="py-1.5 text-sm font-medium text-indigo-600 underline underline-offset-4 hover:text-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:text-indigo-300 dark:hover:text-indigo-200 dark:focus-visible:outline-indigo-300"
          >Edit<span class="sr-only"> billing details</span></a
        >
      </div>
      <dl class="divide-y divide-gray-200 text-sm dark:divide-gray-700">
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Company</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">Northwind Traders Ltd</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Billing email</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">accounts@northwind.co</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">VAT number</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">GB 123 4567 89</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 px-4 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Next invoice</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">1 March 2026, $1,240.00</dd>
        </div>
      </dl>
    </div>
  </body>
</html>
