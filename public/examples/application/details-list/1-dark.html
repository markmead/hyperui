<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base (dark) - Details Lists - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6 dark:bg-gray-900">
    <h2 class="text-base font-semibold text-gray-900 dark:text-white">Order summary</h2>
    <div class="mt-4 flow-root">
      <dl class="-my-3 divide-y divide-gray-200 text-sm dark:divide-gray-700">
        <div class="grid grid-cols-1 gap-1 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Order number</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">#10482</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Placed on</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">12 February 2026</dd>
        </div>
        <div class="grid grid-cols-1 gap-1 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Status</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">
            <span
              class="rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800 dark:bg-green-800 dark:text-green-100"
              >Delivered</span
            >
          </dd>
        </div>
        <div class="grid grid-cols-1 gap-1 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Total</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">
            $248.00, paid by Visa ending 4242
          </dd>
        </div>
        <div class="grid grid-cols-1 gap-1 py-3 sm:grid-cols-3 sm:gap-4">
          <dt class="font-medium text-gray-900 dark:text-white">Ship to</dt>
          <dd class="text-gray-700 sm:col-span-2 dark:text-gray-200">
            Amara Okafor, 14 Harbour Street, Bristol BS1 4RB
          </dd>
        </div>
      </dl>
    </div>
  </body>
</html>
