<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base - Tabs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6">
    <div class="overflow-x-auto">
      <div role="tablist" aria-label="Project" class="flex w-max gap-1">
        <button
          type="button"
          role="tab"
          id="base-tab-0"
          aria-controls="base-panel-0"
          aria-selected="true"
          tabindex="0"
          class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 aria-selected:bg-gray-100 aria-selected:text-gray-900"
        >
          Overview
        </button>
        <button
          type="button"
          role="tab"
          id="base-tab-1"
          aria-controls="base-panel-1"
          aria-selected="false"
          tabindex="-1"
          class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 aria-selected:bg-gray-100 aria-selected:text-gray-900"
        >
          Activity
        </button>
        <button
          type="button"
          role="tab"
          id="base-tab-2"
          aria-controls="base-panel-2"
          aria-selected="false"
          tabindex="-1"
          class="shrink-0 rounded-md px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 aria-selected:bg-gray-100 aria-selected:text-gray-900"
        >
          Files
        </button>
      </div>
    </div>
    <div
      role="tabpanel"
      id="base-panel-0"
      aria-labelledby="base-tab-0"
      tabindex="0"
      class="mt-6 text-pretty text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <h2 class="font-medium text-gray-900">Northwind redesign</h2>
      <p class="mt-1">
        Due 14 March. 18 of 24 tasks are done and the team is on track for the first review.
      </p>
    </div>
    <div
      role="tabpanel"
      id="base-panel-1"
      aria-labelledby="base-tab-1"
      tabindex="0"
      hidden
      class="mt-6 text-pretty text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <p>
        Priya moved "Checkout flow" to review 2 hours ago. Tom commented on "Pricing page"
        yesterday.
      </p>
    </div>
    <div
      role="tabpanel"
      id="base-panel-2"
      aria-labelledby="base-tab-2"
      tabindex="0"
      hidden
      class="mt-6 text-pretty text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <p>
        12 files, 48 MB. The latest upload is
        <span class="font-medium text-gray-900">brand-kit.zip</span>, added by Amara on Monday.
      </p>
    </div>

    <script>
      document.querySelectorAll('[role="tablist"]').forEach((tabListEl) => {
        const tabEls = [...tabListEl.querySelectorAll('[role="tab"]')]
        const isVertical = tabListEl.getAttribute('aria-orientation') === 'vertical'

        function selectTab(selectedEl) {
          tabEls.forEach((tabEl) => {
            const isSelected = tabEl === selectedEl

            tabEl.setAttribute('aria-selected', isSelected)
            tabEl.tabIndex = isSelected ? 0 : -1
            document.getElementById(tabEl.getAttribute('aria-controls')).hidden = !isSelected
          })
        }

        tabEls.forEach((tabEl, index) => {
          tabEl.addEventListener('click', () => selectTab(tabEl))

          tabEl.addEventListener('keydown', (event) => {
            // In a right-to-left page the first tab is on the right, so the arrows swap.
            const isRtl = getComputedStyle(tabListEl).direction === 'rtl'
            const horizontalPrevKey = isRtl ? 'ArrowRight' : 'ArrowLeft'
            const horizontalNextKey = isRtl ? 'ArrowLeft' : 'ArrowRight'
            const prevKey = isVertical ? 'ArrowUp' : horizontalPrevKey
            const nextKey = isVertical ? 'ArrowDown' : horizontalNextKey
            let nextIndex

            if (event.key === nextKey) nextIndex = (index + 1) % tabEls.length
            else if (event.key === prevKey) nextIndex = (index - 1 + tabEls.length) % tabEls.length
            else if (event.key === 'Home') nextIndex = 0
            else if (event.key === 'End') nextIndex = tabEls.length - 1
            else return

            event.preventDefault()
            tabEls[nextIndex].focus()
            selectTab(tabEls[nextIndex])
          })
        })
      })
    </script>
  </body>
</html>
