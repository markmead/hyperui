<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pills - Tabs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6">
    <div class="overflow-x-auto">
      <div role="tablist" aria-label="Time range" class="flex w-max gap-2">
        <button
          type="button"
          role="tab"
          id="pills-tab-0"
          aria-controls="pills-panel-0"
          aria-selected="true"
          tabindex="0"
          class="shrink-0 rounded-full px-4 py-1.5 text-sm font-medium text-gray-600 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 aria-selected:bg-indigo-600 aria-selected:text-white aria-selected:ring-indigo-600"
        >
          Last 7 days
        </button>
        <button
          type="button"
          role="tab"
          id="pills-tab-1"
          aria-controls="pills-panel-1"
          aria-selected="false"
          tabindex="-1"
          class="shrink-0 rounded-full px-4 py-1.5 text-sm font-medium text-gray-600 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 aria-selected:bg-indigo-600 aria-selected:text-white aria-selected:ring-indigo-600"
        >
          Last 30 days
        </button>
        <button
          type="button"
          role="tab"
          id="pills-tab-2"
          aria-controls="pills-panel-2"
          aria-selected="false"
          tabindex="-1"
          class="shrink-0 rounded-full px-4 py-1.5 text-sm font-medium text-gray-600 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 aria-selected:bg-indigo-600 aria-selected:text-white aria-selected:ring-indigo-600"
        >
          This year
        </button>
      </div>
    </div>
    <div
      role="tabpanel"
      id="pills-panel-0"
      aria-labelledby="pills-tab-0"
      tabindex="0"
      class="mt-6 text-pretty text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <p>
        <span class="text-2xl font-semibold text-gray-900">1,284</span> visitors, up 8% on the
        previous 7 days.
      </p>
    </div>
    <div
      role="tabpanel"
      id="pills-panel-1"
      aria-labelledby="pills-tab-1"
      tabindex="0"
      hidden
      class="mt-6 text-pretty text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <p>
        <span class="text-2xl font-semibold text-gray-900">5,902</span> visitors, up 12% on the
        previous 30 days.
      </p>
    </div>
    <div
      role="tabpanel"
      id="pills-panel-2"
      aria-labelledby="pills-tab-2"
      tabindex="0"
      hidden
      class="mt-6 text-pretty text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <p>
        <span class="text-2xl font-semibold text-gray-900">61,430</span> visitors since 1 January.
      </p>
    </div>

    <script>
      document.querySelectorAll('[role="tablist"]').forEach((tabListEl) => {
        const tabEls = [...tabListEl.querySelectorAll('[role="tab"]')]
        const isVertical = tabListEl.getAttribute('aria-orientation') === 'vertical'

        function selectTab(selectedEl) {
          tabEls.forEach((tabEl) => {
            const isSelected = tabEl === selectedEl

            tabEl.setAttribute('aria-selected', isSelected)
            tabEl.tabIndex = isSelected ? 0 : -1
            document.getElementById(tabEl.getAttribute('aria-controls')).hidden = !isSelected
          })
        }

        tabEls.forEach((tabEl, index) => {
          tabEl.addEventListener('click', () => selectTab(tabEl))

          tabEl.addEventListener('keydown', (event) => {
            // In a right-to-left page the first tab is on the right, so the arrows swap.
            const isRtl = getComputedStyle(tabListEl).direction === 'rtl'
            const horizontalPrevKey = isRtl ? 'ArrowRight' : 'ArrowLeft'
            const horizontalNextKey = isRtl ? 'ArrowLeft' : 'ArrowRight'
            const prevKey = isVertical ? 'ArrowUp' : horizontalPrevKey
            const nextKey = isVertical ? 'ArrowDown' : horizontalNextKey
            let nextIndex

            if (event.key === nextKey) nextIndex = (index + 1) % tabEls.length
            else if (event.key === prevKey) nextIndex = (index - 1 + tabEls.length) % tabEls.length
            else if (event.key === 'Home') nextIndex = 0
            else if (event.key === 'End') nextIndex = tabEls.length - 1
            else return

            event.preventDefault()
            tabEls[nextIndex].focus()
            selectTab(tabEls[nextIndex])
          })
        })
      })
    </script>
  </body>
</html>
