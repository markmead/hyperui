<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standout - Toasts - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="ml-auto max-w-sm p-6">
    <div
      data-toast
      role="status"
      class="flex items-center gap-3 overflow-hidden rounded-xl bg-gray-950 py-3 pr-3 pl-4 text-white shadow-xl ring-1 ring-white/10"
    >
      <p data-message class="min-w-0 flex-1 text-sm font-medium">Conversation archived</p>
      <button
        type="button"
        data-undo
        class="rounded-md px-2 py-1 text-sm font-semibold text-sky-300 hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      >
        Undo
      </button>
      <button
        type="button"
        data-dismiss
        class="-m-1 shrink-0 rounded-md p-1 text-gray-400 hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      >
        <span class="sr-only">Dismiss</span>
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <script>
      const toastEl = document.querySelector('[data-toast]')
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

      if (!reduceMotion) {
        toastEl.animate(
          [
            { opacity: 0, transform: 'translateX(1rem)' },
            { opacity: 1, transform: 'translateX(0)' },
          ],
          { duration: 200, easing: 'ease-out' },
        )
      }

      function dismissToast() {
        if (reduceMotion) {
          toastEl.remove()
          return
        }

        toastEl
          .animate(
            [
              { opacity: 1, transform: 'translateX(0)' },
              { opacity: 0, transform: 'translateX(1rem)' },
            ],
            { duration: 150, easing: 'ease-in' },
          )
          .finished.then(() => toastEl.remove())
      }

      document.querySelectorAll('[data-dismiss]').forEach((buttonEl) => {
        buttonEl.addEventListener('click', dismissToast)
      })

      const undoEl = document.querySelector('[data-undo]')

      undoEl.addEventListener('click', () => {
        document.querySelector('[data-message]').textContent = 'Conversation restored'
        undoEl.remove()
      })
    </script>
  </body>
</html>
