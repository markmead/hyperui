<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success - Toasts - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="ml-auto max-w-sm p-6">
    <div
      data-toast
      role="status"
      class="overflow-hidden rounded-xl bg-white p-4 shadow-xl ring-1 ring-gray-950/10"
    >
      <div class="flex items-start gap-3">
        <span
          class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-green-50 text-green-600 ring-1 ring-green-600/20 ring-inset"
          ><svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg
        ></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold text-gray-900">Invoice sent</p>
          <p class="mt-1 text-sm text-gray-600">INV-0142 was emailed to accounts@northwind.co.</p>
          <a
            href="#"
            class="mt-2 inline-block rounded-sm text-sm font-medium text-green-700 underline underline-offset-4 hover:no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900"
            >View invoice</a
          >
        </div>
        <button
          type="button"
          data-dismiss
          class="-m-1 shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900"
        >
          <span class="sr-only">Dismiss</span>
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    <script>
      const toastEl = document.querySelector('[data-toast]')
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

      if (!reduceMotion) {
        toastEl.animate(
          [
            { opacity: 0, transform: 'translateX(1rem)' },
            { opacity: 1, transform: 'translateX(0)' },
          ],
          { duration: 200, easing: 'ease-out' },
        )
      }

      function dismissToast() {
        if (reduceMotion) {
          toastEl.remove()
          return
        }

        toastEl
          .animate(
            [
              { opacity: 1, transform: 'translateX(0)' },
              { opacity: 0, transform: 'translateX(1rem)' },
            ],
            { duration: 150, easing: 'ease-in' },
          )
          .finished.then(() => toastEl.remove())
      }

      document.querySelectorAll('[data-dismiss]').forEach((buttonEl) => {
        buttonEl.addEventListener('click', dismissToast)
      })
    </script>
  </body>
</html>
