<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error with retry (dark) - Toasts - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="ml-auto max-w-sm p-6 dark:bg-gray-900">
    <div
      data-toast
      role="alert"
      class="overflow-hidden rounded-xl bg-white p-4 shadow-xl ring-1 ring-gray-950/10 dark:bg-gray-900 dark:ring-white/15"
    >
      <div class="flex items-start gap-3">
        <span
          class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-red-50 text-red-600 ring-1 ring-red-600/20 ring-inset dark:bg-red-800 dark:text-red-300 dark:ring-red-300/20"
          ><svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v3.75m0 3.75h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            /></svg
        ></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold text-gray-900 dark:text-white">Payment failed</p>
          <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
            Your card was declined. Try again or use a different card.
          </p>
          <div class="mt-3 flex gap-2">
            <button
              type="button"
              data-retry
              class="inline-flex items-center gap-1.5 rounded-md bg-red-600 px-2.5 py-1.5 text-sm/none font-medium text-white hover:bg-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600 disabled:cursor-wait disabled:opacity-70 dark:bg-red-300 dark:text-gray-900 dark:hover:bg-red-200 dark:focus-visible:outline-red-300"
            >
              <span data-retry-spinner hidden
                ><svg
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  class="size-4 animate-spin motion-reduce:animate-none"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3a9 9 0 1 0 9 9"
                  /></svg
              ></span>
              <span data-retry-label>Try again</span>
            </button>
            <button
              type="button"
              class="rounded-md px-2.5 py-1.5 text-sm/none font-medium text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 dark:text-gray-200 dark:hover:bg-gray-800 dark:focus-visible:outline-gray-50"
            >
              Change card
            </button>
          </div>
        </div>
        <button
          type="button"
          data-dismiss
          class="-m-1 shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 dark:hover:bg-gray-800 dark:hover:text-gray-200 dark:focus-visible:outline-gray-50"
        >
          <span class="sr-only">Dismiss</span>
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    <script>
      const toastEl = document.querySelector('[data-toast]')
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

      if (!reduceMotion) {
        toastEl.animate(
          [
            { opacity: 0, transform: 'translateX(1rem)' },
            { opacity: 1, transform: 'translateX(0)' },
          ],
          { duration: 200, easing: 'ease-out' },
        )
      }

      function dismissToast() {
        if (reduceMotion) {
          toastEl.remove()
          return
        }

        toastEl
          .animate(
            [
              { opacity: 1, transform: 'translateX(0)' },
              { opacity: 0, transform: 'translateX(1rem)' },
            ],
            { duration: 150, easing: 'ease-in' },
          )
          .finished.then(() => toastEl.remove())
      }

      document.querySelectorAll('[data-dismiss]').forEach((buttonEl) => {
        buttonEl.addEventListener('click', dismissToast)
      })

      const retryEl = document.querySelector('[data-retry]')

      retryEl.addEventListener('click', () => {
        retryEl.disabled = true
        retryEl.querySelector('[data-retry-spinner]').hidden = false
        retryEl.querySelector('[data-retry-label]').textContent = 'Trying again…'

        setTimeout(dismissToast, 1500)
      })
    </script>
  </body>
</html>
