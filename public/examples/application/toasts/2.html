<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error with retry - Toasts - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="ml-auto max-w-sm p-6">
    <div
      role="alert"
      class="overflow-hidden rounded-xl bg-white p-4 shadow-lg ring-1 ring-gray-950/10"
    >
      <div class="flex items-start gap-3">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"
            />
          </svg>
        </span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-gray-900">Payment failed</p>
          <p class="mt-1 text-sm text-gray-600">
            Your card was declined. Try again or use a different card.
          </p>
          <div class="mt-3 flex gap-2">
            <button
              type="button"
              class="rounded-md bg-red-600 px-2.5 py-1.5 text-sm/none font-medium text-white hover:bg-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
            >
              Try again
            </button>
            <button
              type="button"
              class="rounded-md px-2.5 py-1.5 text-sm/none font-medium text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900"
            >
              Change card
            </button>
          </div>
        </div>
        <button
          type="button"
          class="-m-1 shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900"
        >
          <span class="sr-only">Dismiss</span>
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
