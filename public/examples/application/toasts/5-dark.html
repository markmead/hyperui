<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload progress (dark) - Toasts - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="ml-auto max-w-sm p-6 dark:bg-gray-900">
    <div
      role="status"
      class="overflow-hidden rounded-xl bg-white p-4 shadow-lg ring-1 ring-gray-950/10 dark:bg-gray-900 dark:ring-white/15"
    >
      <div class="flex items-start gap-3">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full bg-blue-100 text-blue-700 dark:bg-blue-800 dark:text-blue-200"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"
            />
          </svg>
        </span>
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline justify-between gap-2">
            <p class="truncate text-sm font-medium text-gray-900 dark:text-white">brand-kit.zip</p>
            <p class="text-sm text-gray-500 tabular-nums dark:text-gray-400">64%</p>
          </div>
          <div
            class="mt-2 h-1.5 overflow-hidden rounded-full bg-gray-100 dark:bg-gray-800"
            role="progressbar"
            aria-label="Upload progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="64"
          >
            <div class="h-full w-[64%] rounded-full bg-blue-600 dark:bg-blue-300"></div>
          </div>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
            18 MB of 28 MB, about 10 seconds left
          </p>
        </div>
        <button
          type="button"
          class="-my-1 shrink-0 rounded-md px-2.5 py-1.5 text-sm/none font-medium text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 dark:text-gray-200 dark:hover:bg-gray-800 dark:focus-visible:outline-gray-50"
        >
          Cancel
        </button>
      </div>
    </div>
  </body>
</html>
