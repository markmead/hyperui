<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title, value, themed growth stat and area sparkline (dark) - Stats - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6 dark:bg-gray-900">
    <article
      class="flex items-center justify-between gap-4 rounded-lg border border-gray-100 bg-white p-6 dark:border-gray-800 dark:bg-gray-900"
    >
      <div>
        <strong class="block text-sm font-medium text-gray-600 dark:text-gray-300"
          >Active customers</strong
        >
        <p class="mt-1 text-2xl font-medium text-gray-900 dark:text-white">2,318</p>
        <div class="mt-2">
          <div
            class="inline-flex gap-2 rounded-sm bg-green-100 p-1 text-green-800 dark:bg-green-800 dark:text-green-100"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              class="size-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
              />
            </svg>
            <span class="sr-only">Increase: </span>
            <span class="text-xs font-medium">4.1%</span>
          </div>
        </div>
      </div>
      <svg
        role="img"
        aria-label="Active customers over the last six months, rising from 1,840 to 2,318"
        viewBox="0 0 120 40"
        preserveAspectRatio="none"
        class="h-16 w-32 shrink-0"
      >
        <polygon
          points="0,40 0,32 24,24 48,28 72,16 96,12 120,4 120,40"
          class="fill-emerald-600/10 stroke-none dark:fill-emerald-300/10"
        />
        <polyline
          points="0,32 24,24 48,28 72,16 96,12 120,4"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
          class="stroke-emerald-600 dark:stroke-emerald-300"
        />
      </svg>
    </article>
    <article
      class="flex items-center justify-between gap-4 rounded-lg border border-gray-100 bg-white p-6 dark:border-gray-800 dark:bg-gray-900"
    >
      <div>
        <strong class="block text-sm font-medium text-gray-600 dark:text-gray-300"
          >Refund rate</strong
        >
        <p class="mt-1 text-2xl font-medium text-gray-900 dark:text-white">3.2%</p>
        <div class="mt-2">
          <div
            class="inline-flex gap-2 rounded-sm bg-red-100 p-1 text-red-700 dark:bg-red-800 dark:text-red-200"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              class="size-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"
              />
            </svg>
            <span class="sr-only">Decrease: </span>
            <span class="text-xs font-medium">1.4%</span>
          </div>
        </div>
      </div>
      <svg
        role="img"
        aria-label="Refund rate over the last six months, falling from 4.6% to 3.2%"
        viewBox="0 0 120 40"
        preserveAspectRatio="none"
        class="h-16 w-32 shrink-0"
      >
        <polygon
          points="0,40 0,6 24,12 48,10 72,22 96,26 120,34 120,40"
          class="fill-red-600/10 stroke-none dark:fill-red-300/10"
        />
        <polyline
          points="0,6 24,12 48,10 72,22 96,26 120,34"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
          class="stroke-red-600 dark:stroke-red-300"
        />
      </svg>
    </article>
  </body>
</html>
