<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered title with bordered stats (dark) - Stats - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="dark:bg-gray-900">
    <section>
      <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
        <div class="mx-auto max-w-3xl text-center">
          <h2 class="text-3xl font-bold text-gray-900 sm:text-4xl dark:text-white">
            Trusted by teams that ship
          </h2>

          <p class="mt-4 text-gray-500 sm:text-xl dark:text-gray-400">
            From five-person startups to hundred-person companies, teams use Northwind to keep
            everyone moving in the same direction.
          </p>
        </div>

        <dl class="mt-6 grid grid-cols-1 gap-4 sm:mt-8 sm:grid-cols-2 lg:grid-cols-4">
          <div
            class="flex flex-col rounded-lg border border-gray-100 px-4 py-8 text-center dark:border-gray-800"
          >
            <dt class="order-last text-lg font-medium text-gray-500 dark:text-gray-400">
              Teams onboarded
            </dt>

            <dd class="text-4xl font-extrabold text-indigo-600 md:text-5xl dark:text-indigo-300">
              12k+
            </dd>
          </div>

          <div
            class="flex flex-col rounded-lg border border-gray-100 px-4 py-8 text-center dark:border-gray-800"
          >
            <dt class="order-last text-lg font-medium text-gray-500 dark:text-gray-400">
              Integrations
            </dt>

            <dd class="text-4xl font-extrabold text-indigo-600 md:text-5xl dark:text-indigo-300">
              40+
            </dd>
          </div>

          <div
            class="flex flex-col rounded-lg border border-gray-100 px-4 py-8 text-center dark:border-gray-800"
          >
            <dt class="order-last text-lg font-medium text-gray-500 dark:text-gray-400">
              Average uptime
            </dt>

            <dd class="text-4xl font-extrabold text-indigo-600 md:text-5xl dark:text-indigo-300">
              99.98%
            </dd>
          </div>

          <div
            class="flex flex-col rounded-lg border border-gray-100 px-4 py-8 text-center dark:border-gray-800"
          >
            <dt class="order-last text-lg font-medium text-gray-500 dark:text-gray-400">
              Support response
            </dt>

            <dd class="text-4xl font-extrabold text-indigo-600 md:text-5xl dark:text-indigo-300">
              &lt;2hr
            </dd>
          </div>
        </dl>
      </div>
    </section>
  </body>
</html>
