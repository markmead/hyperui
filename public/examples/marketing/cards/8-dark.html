<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podcast Post (dark) - Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl p-6 dark:bg-gray-900">
    <article
      class="rounded-xl bg-white p-4 ring-3 ring-indigo-50 sm:p-6 lg:p-8 dark:bg-gray-900 dark:ring-indigo-800"
    >
      <div class="flex items-start sm:gap-8">
        <div
          class="hidden sm:grid sm:size-20 sm:shrink-0 sm:place-content-center sm:rounded-full sm:border-2 sm:border-indigo-500 dark:sm:border-indigo-400"
          aria-hidden="true"
        >
          <div class="flex items-center gap-1">
            <span class="h-8 w-0.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
            <span class="h-6 w-0.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
            <span class="h-4 w-0.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
            <span class="h-6 w-0.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
            <span class="h-8 w-0.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
          </div>
        </div>

        <div>
          <strong
            class="rounded-sm border border-indigo-500 bg-indigo-500 px-3 py-1.5 text-[10px] font-medium text-white dark:border-indigo-400 dark:bg-indigo-400 dark:text-gray-900"
          >
            Episode #101
          </strong>

          <h3 class="mt-4 text-lg font-medium sm:text-xl dark:text-white">
            <a href="#" class="hover:underline"> How a ten person team builds for millions </a>
          </h3>

          <p class="mt-1 text-sm text-gray-700 dark:text-gray-200">
            Two founders explain how they stayed under ten people for five years, and why they would
            do it again.
          </p>

          <div class="mt-4 sm:flex sm:items-center sm:gap-2">
            <div class="flex items-center gap-1 text-gray-500 dark:text-gray-400">
              <svg
                aria-hidden="true"
                class="size-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>

              <p class="text-xs font-medium">48:32 minutes</p>
            </div>

            <span class="hidden sm:block" aria-hidden="true">&middot;</span>

            <p class="mt-2 text-xs font-medium text-gray-500 sm:mt-0 dark:text-gray-400">
              Featuring-3
              <a href="#" class="underline hover:text-gray-700 dark:hover:text-gray-200">Barry</a>,
              <a href="#" class="underline hover:text-gray-700 dark:hover:text-gray-200">Sandra</a>
              and
              <a href="#" class="underline hover:text-gray-700 dark:hover:text-gray-200">August</a>
            </p>
          </div>
        </div>
      </div>
    </article>
  </body>
</html>
