<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property (dark) - Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6 dark:bg-gray-900">
    <article
      class="relative overflow-hidden rounded-xl bg-white ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 dark:bg-gray-900 dark:ring-gray-700 dark:has-[a:focus-visible]:outline-indigo-300"
    >
      <img
        alt=""
        src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&q=80&w=1160"
        class="aspect-4/3 w-full object-cover"
      />
      <div class="p-5">
        <p class="text-2xl font-semibold text-gray-900 dark:text-white">$485,000</p>
        <h3 class="mt-1 text-sm text-gray-600 dark:text-gray-300">
          <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
            >14 Harbour Street, Bristol BS1 4RB</a
          >
        </h3>
        <dl class="mt-4 flex gap-6 border-t border-gray-200 pt-4 text-sm dark:border-gray-700">
          <div>
            <dt class="text-gray-500 dark:text-gray-400">Bedrooms</dt>
            <dd class="mt-0.5 font-medium text-gray-900 dark:text-white">3</dd>
          </div>
          <div>
            <dt class="text-gray-500 dark:text-gray-400">Bathrooms</dt>
            <dd class="mt-0.5 font-medium text-gray-900 dark:text-white">2</dd>
          </div>
          <div>
            <dt class="text-gray-500 dark:text-gray-400">Floor area</dt>
            <dd class="mt-0.5 font-medium text-gray-900 dark:text-white">112 m²</dd>
          </div>
        </dl>
      </div>
    </article>
  </body>
</html>
