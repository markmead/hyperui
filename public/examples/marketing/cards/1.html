<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product - Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <article
      class="group relative overflow-hidden rounded-xl bg-white ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600"
    >
      <img
        alt=""
        src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=1160"
        class="aspect-square w-full object-cover"
      />
      <div class="p-4">
        <h3 class="font-medium text-gray-900">
          <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
            >Trail Pack 30L<span class="sr-only">, $149</span></a
          >
        </h3>
        <p class="mt-1 text-sm text-gray-600">Waterproof, with a padded laptop sleeve.</p>
        <div class="mt-3 flex items-center justify-between">
          <p class="text-lg font-semibold text-gray-900">$149</p>
          <p class="text-sm text-gray-500">4.8 · 212 reviews</p>
        </div>
      </div>
    </article>
  </body>
</html>
