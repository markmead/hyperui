<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full-bleed image hero (dark) - Sections - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="dark:bg-gray-900">
    <section class="overflow-hidden bg-gray-50 sm:grid sm:grid-cols-2 dark:bg-gray-800">
      <div class="p-8 md:p-12 lg:px-16 lg:py-24">
        <div class="mx-auto max-w-xl text-center sm:text-start">
          <h1 class="text-2xl font-bold text-balance text-gray-900 md:text-3xl dark:text-white">
            Plan, track and invoice your work in one place
          </h1>

          <p class="mt-4 text-pretty text-gray-600 dark:text-gray-300">
            Northwind brings your projects, timesheets and invoices together, so small teams spend
            less time on admin and more time on the work itself.
          </p>

          <div class="mt-4 md:mt-8">
            <a
              href="#"
              class="inline-block rounded-sm bg-indigo-600 px-12 py-3 text-sm font-medium text-white transition hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-300 dark:text-gray-900 dark:hover:bg-indigo-200 dark:focus-visible:outline-indigo-300"
            >
              Start your free trial
            </a>
          </div>
        </div>
      </div>

      <img
        alt=""
        src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=1160"
        class="h-56 w-full object-cover sm:h-full"
      />
