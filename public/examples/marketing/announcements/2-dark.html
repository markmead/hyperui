<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>With dismiss (dark) - Announcements - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="dark:bg-gray-900">
    <div
      data-announcement
      class="flex items-center gap-4 bg-indigo-600 px-4 py-2.5 text-white dark:bg-indigo-300 dark:text-gray-900"
    >
      <p class="flex-1 ps-6 text-center text-sm">
        Reports now export to PDF.
        <a
          href="#"
          class="font-medium underline underline-offset-4 hover:no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white dark:focus-visible:outline-gray-900"
          >See what's new</a
        >
      </p>
      <button
        type="button"
        data-dismiss
        class="-m-1.5 shrink-0 rounded-md p-1.5 hover:bg-black/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white dark:hover:bg-white/10 dark:focus-visible:outline-gray-900"
      >
        <span class="sr-only">Dismiss announcement</span>
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <script>
      document.querySelectorAll('[data-dismiss]').forEach((buttonEl) => {
        buttonEl.addEventListener('click', () => buttonEl.closest('[data-announcement]').remove())
      })
    </script>
  </body>
</html>
