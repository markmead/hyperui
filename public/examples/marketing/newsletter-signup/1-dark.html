<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple signup (dark) - Newsletter Signup - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="dark:bg-gray-900">
    <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
      <div class="max-w-xl">
        <p class="text-sm font-medium text-indigo-700 dark:text-indigo-200">The Friday Brief</p>

        <h2
          class="mt-2 text-2xl font-semibold text-balance text-gray-900 sm:text-3xl dark:text-white"
        >
          One email a week on what shipped in design and code
        </h2>

        <p class="mt-4 text-pretty text-gray-700 dark:text-gray-200">
          Five short reads, picked by our team. Free, every Friday morning, and you can leave with
          one click.
        </p>

        <form action="#" class="mt-6">
          <label for="Email" class="sr-only">Email address</label>

          <div class="flex flex-col gap-3 sm:flex-row">
            <input
              type="email"
              id="Email"
              name="email"
              autocomplete="email"
              required
              placeholder="you@company.com"
              aria-describedby="EmailHelp"
              class="h-12 w-full rounded-md border-gray-300 shadow-sm sm:max-w-xs dark:border-gray-600 dark:bg-gray-900 dark:text-white"
            />

            <button
              type="submit"
              class="h-12 rounded-md bg-indigo-600 px-6 text-sm font-medium text-white transition-colors hover:bg-indigo-700 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600 dark:bg-indigo-300 dark:text-gray-900 dark:hover:bg-indigo-200 dark:focus:outline-indigo-300"
            >
              Subscribe
            </button>
          </div>

          <p id="EmailHelp" class="mt-3 text-sm text-gray-700 dark:text-gray-200">
            Join 12,400 readers. No spam, and we never share your email.
            <a
              href="#"
              class="font-medium text-gray-900 underline hover:no-underline dark:text-white"
            >
              Privacy policy
            </a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
