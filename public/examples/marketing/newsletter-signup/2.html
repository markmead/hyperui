<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple signup centered - Newsletter Signup - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body>
    <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
      <div class="rounded-2xl bg-gray-100 px-6 py-12 text-center sm:px-12">
        <h2 class="mx-auto max-w-lg text-2xl font-semibold text-balance text-gray-900 sm:text-3xl">
          Get product updates before they hit the changelog
        </h2>

        <p class="mx-auto mt-4 max-w-md text-pretty text-gray-700">
          A short note about twice a month: what we released, what we are testing and what we
          learned.
        </p>

        <form action="#" class="mx-auto mt-8 max-w-md">
          <label for="Email" class="sr-only">Email address</label>

          <div class="flex">
            <input
              type="email"
              id="Email"
              name="email"
              autocomplete="email"
              required
              placeholder="you@company.com"
              aria-describedby="EmailHelp"
              class="h-12 min-w-0 flex-1 rounded-l-md rounded-r-none border-gray-300 shadow-sm"
            />

            <button
              type="submit"
              class="h-12 rounded-l-none rounded-r-md bg-indigo-600 px-5 text-sm font-medium text-white transition-colors hover:bg-indigo-700 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600"
            >
              Notify me
            </button>
          </div>

          <p id="EmailHelp" class="mt-3 text-sm text-gray-700">
            Unsubscribe any time.
            <a href="#" class="font-medium text-gray-900 underline hover:no-underline">
              Privacy policy
            </a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
