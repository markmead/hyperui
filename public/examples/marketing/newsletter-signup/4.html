<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark panel with benefits - Newsletter Signup - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body>
    <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
      <div
        class="rounded-2xl bg-gray-950 px-6 py-12 sm:px-12 lg:flex lg:items-center lg:justify-between lg:gap-16"
      >
        <div class="max-w-xl">
          <h2 class="text-2xl font-semibold text-balance text-white sm:text-3xl">
            Hear about new releases first
          </h2>

          <ul class="mt-6 space-y-3 text-gray-300">
            <li class="flex gap-3">
              <svg
                viewBox="0 0 20 20"
                fill="currentColor"
                class="mt-0.5 size-5 shrink-0 text-emerald-400"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
                  clip-rule="evenodd"
                />
              </svg>

              Early access to every new feature
            </li>

            <li class="flex gap-3">
              <svg
                viewBox="0 0 20 20"
                fill="currentColor"
                class="mt-0.5 size-5 shrink-0 text-emerald-400"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
                  clip-rule="evenodd"
                />
              </svg>

              Release notes written by the people who built it
            </li>

            <li class="flex gap-3">
              <svg
                viewBox="0 0 20 20"
                fill="currentColor"
                class="mt-0.5 size-5 shrink-0 text-emerald-400"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
                  clip-rule="evenodd"
                />
              </svg>

              A yearly discount for subscribers
            </li>
          </ul>
        </div>

        <form action="#" class="mt-8 w-full max-w-md lg:mt-0">
          <label for="Email" class="block text-sm font-medium text-white">Email address</label>

          <div class="mt-2 flex flex-col gap-3 sm:flex-row">
            <input
              type="email"
              id="Email"
              name="email"
              autocomplete="email"
              required
              placeholder="you@company.com"
              aria-describedby="EmailHelp"
              class="h-12 w-full rounded-md border-transparent bg-white text-gray-900 shadow-sm"
            />

            <button
              type="submit"
              class="h-12 rounded-md bg-indigo-500 px-6 text-sm font-medium whitespace-nowrap text-white transition-colors hover:bg-indigo-400 focus:outline-2 focus:outline-offset-2 focus:outline-white"
            >
              Sign up
            </button>
          </div>

          <p id="EmailHelp" class="mt-3 text-sm text-gray-300">
            One email a month. Unsubscribe any time.
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
