<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist and add to bag (dark) - Product Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6 dark:bg-gray-900">
    <article
      class="group relative overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 dark:bg-gray-900 dark:ring-gray-700 dark:has-[a:focus-visible]:outline-indigo-300"
    >
      <div class="relative bg-gray-100 dark:bg-gray-800">
        <img
          alt=""
          src="https://images.unsplash.com/photo-1599481238640-4c1288750d7a?auto=format&fit=crop&q=80&w=1160"
          class="aspect-square w-full object-cover"
        />
        <p
          class="absolute start-3 top-3 rounded-full bg-indigo-600 px-2.5 py-1 text-xs font-semibold text-white dark:bg-indigo-300 dark:text-gray-900"
        >
          New
        </p>
        <button
          type="button"
          data-wishlist
          aria-pressed="false"
          class="group/wish absolute end-3 top-3 z-10 rounded-full bg-white p-2 text-gray-700 shadow-xs hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-gray-900 dark:text-gray-200 dark:hover:text-white dark:focus-visible:outline-indigo-300"
        >
          <span class="sr-only">Save Beep the robot to wishlist</span>
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5 group-aria-pressed/wish:fill-rose-600 group-aria-pressed/wish:stroke-rose-600 dark:group-aria-pressed/wish:fill-rose-300 dark:group-aria-pressed/wish:stroke-rose-300"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
            />
          </svg>
        </button>
      </div>
      <div class="p-4">
        <div class="flex items-start justify-between gap-3">
          <h3 class="text-sm font-medium text-gray-900 dark:text-white">
            <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
              >Beep the walking robot</a
            >
          </h3>
          <p class="text-sm font-semibold text-gray-900 dark:text-white">$14.99</p>
        </div>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
          Walks, spins and flashes. Needs 2 AA batteries.
        </p>
        <button
          type="button"
          data-bag
          class="relative z-10 mt-4 w-full rounded-md bg-gray-900 px-3 py-2.5 text-sm font-medium text-white hover:bg-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-default disabled:bg-green-700 dark:bg-gray-50 dark:text-gray-900 dark:hover:bg-gray-200 dark:focus-visible:outline-indigo-300 dark:disabled:bg-green-200"
        >
          <span data-bag-label aria-live="polite">Add to bag</span>
        </button>
      </div>
    </article>
    <script>
      const wishlistEl = document.querySelector('[data-wishlist]')
      const bagEl = document.querySelector('[data-bag]')

      wishlistEl.addEventListener('click', () => {
        const isSaved = wishlistEl.getAttribute('aria-pressed') === 'true'

        wishlistEl.setAttribute('aria-pressed', String(!isSaved))
      })

      bagEl.addEventListener('click', () => {
        bagEl.disabled = true
        bagEl.querySelector('[data-bag-label]').textContent = 'Added to bag'
      })
    </script>
  </body>
</html>
