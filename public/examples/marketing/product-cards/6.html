<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal with stock - Product Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xl p-6">
    <article
      class="group relative overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 sm:flex"
    >
      <div class="bg-gray-100 sm:w-48 sm:shrink-0">
        <img
          alt=""
          src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&q=80&w=1160"
          class="aspect-square h-full w-full object-cover"
        />
      </div>
      <div class="flex flex-1 flex-col p-4">
        <h3 class="text-sm font-medium text-gray-900">
          <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
            >Tempo running trainer</a
          >
        </h3>
        <p class="mt-1 text-sm text-pretty text-gray-600">
          Light, springy and built for daily miles. Wide fit available.
        </p>
        <p class="mt-3 text-sm font-medium text-amber-700">Only 3 left in your size</p>
        <p class="mt-auto pt-3 text-base font-semibold text-gray-900">$128.00</p>
      </div>
    </article>
  </body>
</html>
