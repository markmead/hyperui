<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sale price - Product Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <article
      class="group relative overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600"
    >
      <div class="relative bg-gray-100">
        <img
          alt=""
          src="https://images.unsplash.com/photo-1628202926206-c63a34b1618f?auto=format&fit=crop&q=80&w=1160"
          class="aspect-square w-full object-cover"
        />
        <p
          class="absolute start-3 top-3 rounded-full bg-rose-600 px-2.5 py-1 text-xs font-semibold text-white"
        >
          Save 38%
        </p>
      </div>
      <div class="p-4">
        <h3 class="text-sm font-medium text-gray-900">
          <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
            >Pulse wireless headphones</a
          >
        </h3>
        <p class="mt-2 flex items-baseline gap-2">
          <span class="sr-only">Now</span>
          <span class="text-base font-semibold text-gray-900">$49.99</span>
          <span class="sr-only">Was</span>
          <del class="text-sm text-gray-500">$80.00</del>
        </p>
      </div>
    </article>
  </body>
</html>
