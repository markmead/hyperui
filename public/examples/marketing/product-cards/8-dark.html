<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flat with badge and details (dark) - Product Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6 dark:bg-gray-900">
    <article

      <h3 class="mt-3 text-sm font-medium text-gray-900 dark:text-white">
        <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"

        >
      </h3>
      <p class="mt-1 text-xs text-gray-600 dark:text-gray-300">3-season &middot; 1.4kg</p>

    </article>
