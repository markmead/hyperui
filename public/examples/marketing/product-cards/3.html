<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colors - Product Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <article
      class="group relative overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600"
    >
      <div class="bg-gray-100">
        <img
          alt=""
          src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&q=80&w=1160"
          class="aspect-square w-full object-cover"
        />
      </div>
      <div class="p-4">
        <h3 class="text-sm font-medium text-gray-900">
          <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
            >Daybreak everyday trainer</a
          >
        </h3>
        <div class="mt-2 flex items-center gap-2">
          <div class="flex -space-x-1" aria-hidden="true">
            <span class="size-4 rounded-full bg-white ring-1 ring-gray-950/15"></span
            ><span class="size-4 rounded-full bg-gray-950 ring-1 ring-gray-950/15"></span
            ><span class="size-4 rounded-full bg-rose-600 ring-1 ring-gray-950/15"></span
            ><span class="size-4 rounded-full bg-sky-600 ring-1 ring-gray-950/15"></span>
          </div>
          <p class="text-sm text-gray-600">4 colors</p>
        </div>
        <p class="mt-2 text-base font-semibold text-gray-900">$142.00</p>
      </div>
    </article>
  </body>
</html>
