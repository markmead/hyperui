<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latest posts list (dark) - Blog Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6 dark:bg-gray-900">
    <section aria-labelledby="latest-heading">
      <h2 id="latest-heading" class="text-base font-semibold text-gray-900 dark:text-white">
        Latest from the blog
      </h2>
      <ul class="mt-3 space-y-1">
        <li
          class="relative flex items-center gap-4 rounded-lg p-2 hover:bg-gray-50 has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 dark:hover:bg-gray-800 dark:has-[a:focus-visible]:outline-indigo-300"
        >
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-medium text-gray-900 dark:text-white">
              <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
                >How we cut page load time in half</a
              >
            </h3>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
              <time datetime="2026-02-10">10 Feb 2026</time>
            </p>
          </div>
          <img
            alt=""
            src="https://images.unsplash.com/photo-1631451095765-2c91616fc9e6?auto=format&fit=crop&q=80&w=1160"
            class="size-16 shrink-0 rounded-lg object-cover"
          />
        </li>
        <li
          class="relative flex items-center gap-4 rounded-lg p-2 hover:bg-gray-50 has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 dark:hover:bg-gray-800 dark:has-[a:focus-visible]:outline-indigo-300"
        >
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-medium text-gray-900 dark:text-white">
              <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
                >Choosing the right tools for a five person team</a
              >
            </h3>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
              <time datetime="2026-02-03">3 Feb 2026</time>
            </p>
          </div>
          <img
            alt=""
            src="https://images.unsplash.com/photo-1661956602116-aa6865609028?auto=format&fit=crop&q=80&w=1160"
            class="size-16 shrink-0 rounded-lg object-cover"
          />
        </li>
        <li
          class="relative flex items-center gap-4 rounded-lg p-2 hover:bg-gray-50 has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 dark:hover:bg-gray-800 dark:has-[a:focus-visible]:outline-indigo-300"
        >
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-medium text-gray-900 dark:text-white">
              <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
                >Five ways to run a calmer weekly planning meeting</a
              >
            </h3>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
              <time datetime="2026-01-27">27 Jan 2026</time>
            </p>
          </div>
          <img
            alt=""
            src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&q=80&w=1160"
            class="size-16 shrink-0 rounded-lg object-cover"
          />
        </li>
      </ul>
    </section>
  </body>
</html>
