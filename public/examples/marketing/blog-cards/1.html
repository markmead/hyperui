<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Bordered with image, date, title and excerpt, shadow on hover - Blog Cards - HyperUI
    </title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <article class="overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg">
      <img
        alt=""
        src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&q=80&w=1160"
        class="h-56 w-full object-cover"
      />

      <div class="bg-white p-4 sm:p-6">
        <time datetime="2026-02-10" class="block text-xs text-gray-500"> 10 Feb 2026 </time>

        <a href="#">
          <h3 class="mt-0.5 text-lg text-gray-900">
            Five ways to run a calmer weekly planning meeting
          </h3>
        </a>

        <p class="mt-2 line-clamp-3 text-sm/relaxed text-gray-500">
          Short agendas, written updates and one clear decision per meeting. Here is the format that
          gave our team back three hours a week.
        </p>
      </div>
    </article>
  </body>
</html>
