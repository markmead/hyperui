<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Background image with overlay containing date, title and excerpt (dark) - Blog Cards - HyperUI
    </title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6 dark:bg-gray-900">
    <article class="relative overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg">
      <img
        alt=""
        src="https://images.unsplash.com/photo-1661956602116-aa6865609028?auto=format&fit=crop&q=80&w=1160"
        class="absolute inset-0 h-full w-full object-cover"
      />

      <div class="relative bg-linear-to-t from-gray-900/50 to-gray-900/25 pt-32 sm:pt-48 lg:pt-64">
        <div class="p-4 sm:p-6">
          <time datetime="2026-02-10" class="block text-xs text-white/90"> 10 Feb 2026 </time>

          <a href="#">
            <h3 class="mt-0.5 text-lg text-white">
              Five ways to run a calmer weekly planning meeting
            </h3>
          </a>

          <p class="mt-2 line-clamp-3 text-sm/relaxed text-white/95">
            Short agendas, written updates and one clear decision per meeting. Here is the format
            that gave our team back three hours a week.
          </p>
        </div>
      </div>
    </article>
  </body>
</html>
