<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>

    <title>
      Gradient border with date, title and tags, animated gradient on hover - Blog Cards - HyperUI
    </title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <article class="rounded-[10px] border border-gray-200 bg-white px-4 pt-12 pb-4">

      <a href="#">
        <h3 class="mt-0.5 text-lg font-medium text-gray-900">
          Why we moved our docs to plain Markdown
        </h3>

      <div class="mt-4 flex flex-wrap gap-1">
        <span
          class="rounded-full bg-purple-100 px-2.5 py-0.5 text-xs whitespace-nowrap text-purple-600"
        >
          Snippet
        </span>

        <span
          class="rounded-full bg-purple-100 px-2.5 py-0.5 text-xs whitespace-nowrap text-purple-600"
