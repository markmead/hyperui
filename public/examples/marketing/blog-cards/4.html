<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text with tags - Blog Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <article
      class="relative rounded-xl bg-white p-6 ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600"
    >
      <p class="text-sm text-gray-500">
        <time datetime="2026-02-10">10 Feb 2026</time> · 4 min read
      </p>
      <h3 class="mt-2 text-lg font-semibold text-gray-900">
        <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
          >Why we moved our docs to plain Markdown</a
        >
      </h3>
      <p class="mt-2 text-sm/relaxed text-gray-600">
        Fewer tools, faster edits and docs that live next to the code they describe.
      </p>
      <ul class="mt-4 flex flex-wrap gap-2" aria-label="Tags">
        <li class="rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-medium text-indigo-700">
          Documentation
        </li>
        <li class="rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-medium text-indigo-700">
          Engineering
        </li>
      </ul>
    </article>
  </body>
</html>
