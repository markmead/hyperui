<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon guide (dark) - Blog Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6 dark:bg-gray-900">
    <article
      class="relative rounded-xl bg-white p-6 ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 dark:bg-gray-900 dark:ring-gray-700 dark:has-[a:focus-visible]:outline-indigo-300"
    >
      <span
        class="flex size-11 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600 dark:bg-indigo-800 dark:text-indigo-300"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"
          />
        </svg>
      </span>
      <h3 class="mt-4 text-lg font-semibold text-gray-900 dark:text-white">
        Learn to plan a quarter
      </h3>
      <p class="mt-2 text-sm/relaxed text-gray-600 dark:text-gray-300">
        A six part guide with templates, from setting goals to reviewing what shipped.
      </p>
      <a
        href="#"
        class="mt-4 inline-flex items-center gap-1 text-sm font-medium text-indigo-600 after:absolute after:inset-0 focus-visible:outline-none dark:text-indigo-300"
        >Start the guide
        <svg
          aria-hidden="true"
          class="size-4 rtl:rotate-180"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 8l4 4m0 0l-4 4m4-4H3"
          /></svg
      ></a>
    </article>
  </body>
</html>
