<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal (dark) - Blog Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6 dark:bg-gray-900">
    <article
      class="relative flex flex-col overflow-hidden rounded-xl bg-white ring-1 ring-gray-200 transition-shadow hover:shadow-lg has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 sm:flex-row dark:bg-gray-900 dark:ring-gray-700 dark:has-[a:focus-visible]:outline-indigo-300"
    >
      <img
        alt=""
        src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&q=80&w=1160"
        class="aspect-video w-full object-cover sm:aspect-auto sm:w-48 sm:shrink-0"
      />
      <div class="p-5">
        <p class="text-sm font-medium text-indigo-600 dark:text-indigo-300">Research</p>
        <h3 class="mt-1 text-lg font-semibold text-gray-900 dark:text-white">
          <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
            >What we learned from 1,000 customer interviews</a
          >
        </h3>
        <p class="mt-2 line-clamp-2 text-sm/relaxed text-gray-600 dark:text-gray-300">
          We spent a year asking customers how they plan their work. The answers changed what we
          build next.
        </p>
        <p class="mt-4 text-sm text-gray-500 dark:text-gray-400">
          <time datetime="2026-01-28">28 Jan 2026</time> · 8 min read
        </p>
      </div>
    </article>
  </body>
</html>
