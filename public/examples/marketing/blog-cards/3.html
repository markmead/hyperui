<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image overlay - Blog Cards - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <article
      class="relative isolate flex aspect-4/5 flex-col justify-end overflow-hidden rounded-2xl bg-gray-950 p-6 has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-indigo-600 sm:aspect-video"
    >
      <img
        alt=""
        src="https://images.unsplash.com/photo-1609557927087-f9cf8e88de18?auto=format&fit=crop&q=80&w=1160"
        class="absolute inset-0 -z-10 size-full object-cover opacity-70"
      />
      <div
        class="absolute inset-0 -z-10 bg-gradient-to-t from-gray-950 via-gray-950/50 to-transparent"
      ></div>
      <p class="text-sm text-gray-200">
        <time datetime="2026-02-03">3 Feb 2026</time> · 5 min read
      </p>
      <h3 class="mt-2 text-xl font-semibold text-pretty text-white">
        <a href="#" class="after:absolute after:inset-0 focus-visible:outline-none"
          >A practical guide to writing release notes</a
        >
      </h3>
      <p class="mt-2 line-clamp-2 text-sm/relaxed text-gray-200">
        Customers read release notes when they are short, specific and written for them.
      </p>
    </article>
  </body>
</html>
