<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter (dark) - CTAs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="dark:bg-gray-900">
    <section class="mx-auto max-w-screen-xl px-4 py-16 sm:px-6 lg:px-8">
      <div class="mx-auto max-w-xl text-center">
        <h2 class="text-3xl font-bold tracking-tight text-pretty text-gray-900 dark:text-white">
          Get one useful email a month
        </h2>
        <p class="mt-3 text-pretty text-gray-600 dark:text-gray-300">
          Product updates, templates and lessons from teams using Northwind. Unsubscribe any time.
        </p>
        <form action="#" class="mt-8 flex flex-col gap-3 sm:flex-row">
          <label for="cta-email" class="sr-only">Email address</label>
          <input
            id="cta-email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@company.com"
            class="min-w-0 flex-1 rounded-lg border-gray-300 px-3.5 py-3 text-sm text-gray-900 shadow-xs focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 dark:border-gray-600 dark:bg-gray-900 dark:text-white dark:focus:border-indigo-300 dark:focus:ring-indigo-300"
          />
          <button
            type="submit"
            class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-3 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-300 dark:text-gray-900 dark:hover:bg-indigo-200 dark:focus-visible:outline-indigo-300"
          >
            Subscribe<svg
              aria-hidden="true"
              class="size-5 rtl:rotate-180"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 8l4 4m0 0l-4 4m4-4H3"
              />
            </svg>
          </button>
        </form>
        <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">
          We send one email a month and never share your address.
        </p>
      </div>
    </section>
  </body>
</html>
