<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offset image - CTAs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body>
    <section class="mx-auto max-w-screen-2xl px-4 py-12 sm:px-6 lg:px-8">
      <div class="grid items-center gap-10 lg:grid-cols-2">
        <div class="max-w-lg">
          <p class="text-sm font-medium text-indigo-600">New in March</p>
          <h2 class="mt-2 text-3xl font-bold tracking-tight text-pretty text-gray-900 sm:text-4xl">
            Send reports your clients actually read
          </h2>
          <p class="mt-4 text-pretty text-gray-600">
            Build a report once, then share it as a live link or a PDF with your logo on every page.
          </p>
          <a
            href="#"
            class="mt-8 inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-3 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
            >See how reports work<svg
              aria-hidden="true"
              class="size-5 rtl:rotate-180"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 8l4 4m0 0l-4 4m4-4H3"
              /></svg
          ></a>
        </div>
        <div class="relative ps-8 pb-8">
          <div class="absolute inset-y-8 start-0 end-8 rounded-2xl bg-indigo-100"></div>
          <img
            alt=""
            src="https://images.unsplash.com/photo-1484959014842-cd1d967a39cf?auto=format&fit=crop&q=80&w=1160"
            class="relative aspect-4/3 w-full rounded-2xl object-cover shadow-lg"
          />
        </div>
      </div>
    </section>
  </body>
</html>
