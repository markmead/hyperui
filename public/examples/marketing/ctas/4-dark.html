<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colored block with image grid (dark) - CTAs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="dark:bg-gray-900">
    <section class="mx-auto max-w-screen-2xl px-4 py-8 sm:px-6 lg:px-8">
      <div class="grid overflow-hidden rounded-2xl md:grid-cols-2">
        <div
          class="flex items-center bg-indigo-600 p-8 text-white md:p-12 lg:p-16 dark:bg-indigo-300 dark:text-gray-900"
        >
          <div class="max-w-md">
            <h2 class="text-3xl font-bold tracking-tight text-pretty">
              Move your team off spreadsheets this week
            </h2>
            <p class="mt-4 text-pretty text-indigo-100 dark:text-indigo-800">
              We import your existing sheets for free, so nothing gets retyped.
            </p>
            <a
              href="#"
              class="mt-8 inline-flex items-center justify-center rounded-lg bg-white px-5 py-3 text-sm font-medium text-indigo-700 hover:bg-indigo-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white dark:bg-gray-900 dark:text-indigo-200 dark:hover:bg-indigo-800 dark:focus-visible:outline-gray-900"
              >Book a free import</a
            >
          </div>
        </div>
        <div class="grid grid-cols-2">
          <img
            alt=""
            src="https://images.unsplash.com/photo-1567168544813-cc03465b4fa8?auto=format&fit=crop&q=80&w=1160"
            class="h-40 w-full object-cover sm:h-56 md:h-full"
          />
          <img
            alt=""
            src="https://images.unsplash.com/photo-1621274790572-7c32596bc67f?auto=format&fit=crop&q=80&w=1160"
            class="h-40 w-full object-cover sm:h-56 md:h-full"
          />
        </div>
      </div>
    </section>
  </body>
</html>
