<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split with image - CTAs - HyperUI</title>
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body>
    <section class="mx-auto max-w-screen-2xl px-4 py-12 sm:px-6 lg:px-8">
      <div class="grid items-center gap-10 lg:grid-cols-2 lg:gap-16">
        <div>
          <h2 class="text-3xl font-bold tracking-tight text-pretty text-gray-900 sm:text-4xl">
            Plan your next quarter in one place
          </h2>
          <p class="mt-4 max-w-lg text-lg text-pretty text-gray-600">
            Join 12,000 teams that replaced scattered spreadsheets with one shared plan. Setup takes
            ten minutes and the trial is free for 14 days.
          </p>
          <div class="mt-8 flex flex-col gap-3 sm:flex-row">
            <a
              href="#"
              class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-3 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
              >Start your free trial</a
            >
            <a
              href="#"
              class="inline-flex items-center justify-center rounded-lg px-5 py-3 text-sm font-medium text-gray-900 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
              >Talk to sales</a
            >
          </div>
          <p class="mt-4 text-sm text-gray-500">No card needed. Cancel any time.</p>
        </div>
        <img
          alt=""
          src="https://images.unsplash.com/photo-1464582883107-8adf2dca8a9f?auto=format&fit=crop&q=80&w=1160"
          class="aspect-4/3 w-full rounded-2xl object-cover"
        />
      </div>
    </section>
  </body>
</html>
